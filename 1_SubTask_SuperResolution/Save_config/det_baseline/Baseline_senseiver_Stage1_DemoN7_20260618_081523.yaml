# =============================================================================
# Deterministic Baselines for PDEBench Multi-Resolution Super-Resolution
# -----------------------------------------------------------------------------
# Run from 1_SubTask_SuperResolution:
#   python src/train_Det_Baseline.py --config Save_config/config_baseline_Det.yaml --baseline-model senseiver
#   python src/train_Det_Baseline.py --config Save_config/config_baseline_Det.yaml --baseline-model mlp_rbf
#
# Supported baseline_model values in this task:
#   senseiver | mlp_rbf
# =============================================================================

# Senseiver Baseline for CFD 0:0:1: All high-resolution cases

# =============================================================================

baseline_model: "senseiver"
training_stage: 1

shared:
  demo_num: 7
  seed: 42
  device_ids: [0]
  reload: false

  paths:
    data_path: 
    save_root: "Save_TrainedModel/det_baseline"
    config_backup_root: "Save_config/det_baseline"

  data:
    dataset_mode: "pdebench_multires"
    dataset_name: "CFD"
    train_ratio: 0.9
    time_stride: 1
    num_workers: 4
    num_x: 128
    num_y: 128

    pdebench_processed_root: "Dataset/PDE_Bench/Processed"
    selected_field_idx_raw: 0
    multires_ratio: "0:0:1" # L:M:H, like "1:1:1", "1:1:0", "0:0:1"
    multires_train_case_fraction: 1
    multires_manifest_path: ""
    eval_resolution: "H"
    Case_Truncate_Ratio: 0.25

  conditioning:
    # PDEBench multi-resolution exposes one selected raw field as model field 0.
    # These H-resolution sensor counts are automatically downscaled for M and L.
    cond_fields: [0]
    n_obs_min_list: [512]
    n_obs_max_list: [512]
    vis_cond_fields: [0]
    vis_n_obs_list: [512]

  logging:
    eval_every: 5
    save_every: 500

  overrides:
    epochs:
    batch_size:
    learning_rate:
    weight_decay:

mlp_rbf_params:
  training:
    epochs: 10000
    batch_size: 512
    learning_rate: 2.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 500
    n_query_points: 1024

  architecture:
    coord_dim: 3
    hidden_dim: 256
    cond_dim: 128
    field_embed_dim: 128
    rbf_sigma: 0.05
    use_fourier_pe: false
    fourier_pe_num_bands: 32
    fourier_pe_max_freq: 64.0

senseiver_params:
  training:
    epochs: 10000
    batch_size: 512
    learning_rate: 2.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 500
    n_query_points: 1024

  architecture:
    coord_dim: 3
    num_latents: 128
    latent_dim: 128
    num_encoder_layers: 3
    num_self_attn_per_block: 3
    num_cross_attn_heads: 8
    num_self_attn_heads: 8
    dec_num_cross_attn_heads: 8
    field_embed_dim: 32
    space_bands: 32
    max_freq: 64.0
    ff_mult: 4
    dropout: 0.0
