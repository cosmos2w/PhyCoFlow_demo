
#----------------------------------------------------------

# For multi-resolution training & super-resolution task

# Option A — simplest workflow: 
# Step-1: Put the multi-resolution settings in this YAML as the default source of truth
# Step 2: Run only: python src/train_pointcloud_ffm.py --config Save_config/config_pointcloud_ffm.yaml

# Option B — explicit / manual manifest build
# We can run:
# python src/organize_train_MultiRes.py \
#     --processed-root ./Dataset/PDE_Bench/Processed \
#     --dataset-name CFD \
#     --selected-field-idx 0 \
#     --multires-ratio 1:1:1 \
#     --multires-train-case-fraction 1.0
# That creates a manifest JSON, for example something like: Dataset/PDE_Bench/Processed/manifests/CFD_field0_ratio_1-1-1.json 

# Then in YAML set: multires_manifest_path: "Dataset/PDE_Bench/Processed/manifests/CFD_field0_ratio_1-1-1.json"
# and run training normally: python src/train_pointcloud_ffm.py --config Save_config/config_pointcloud_ffm.yaml
# This forces training to reuse exactly that manifest.

# Added Case_Truncate_Ratio
# 0 < Case_Truncate_Ratio < 1 → drop the first floor(ratio * N_time) frames of every case
# Case_Truncate_Ratio >= 1 or < 0 → raise error
#
# Added multires_train_case_fraction
# 0 < multires_train_case_fraction <= 1 controls the total training case budget
# BEFORE splitting active cases by multires_ratio. Default 1.0 preserves the
# old behavior. For a high-resolution-only ablation matched to the H case count
# in 1:1:1, use:
#   multires_ratio: "0:0:1"
#   multires_train_case_fraction: 0.3333333333

#----------------------------------------------------------
# Zero-shot super-resolution: test on 1:1:0 for CFD, use upgraded topk_rbf gathering
# Retrained 0518
#----------------------------------------------------------

Demo_Num: 12
device_ids: [1]

# data: "Dataset/Merged_CH4COTU1P.h5"
save_dir: "Save_TrainedModel/ffm_tc_pointcloud"
RELOAD: false                       # If true, continue from latest matching Demo_Num run.
reload_checkpoint: "best"           # ["best", "last"]

seed : 42
epochs : 10000
batch_size : 512
lr : 2.0e-4
weight_decay : 1.0e-6
train_ratio : 0.9
time_stride : 1
num_workers : 4

# ----------------------------------------------------------
# Dataset mode
# ----------------------------------------------------------
dataset_mode: "pdebench_multires"   # ["default", "pdebench_multires"]
# ----------------------------------------------------------
# PDEBench multi-resolution settings
# ----------------------------------------------------------
pdebench_dataset_name: "CFD"         # ["RD", "CFD"]
pdebench_processed_root: "Dataset/PDE_Bench/Processed"
selected_field_idx_raw: 0           # RD: 0-Species_0 ; CFD: 0-Vx
multires_ratio: "1:1:0"             # L:M:H, like "1:1:1", "1:1:0", "0:0:1"
multires_train_case_fraction: 1     # Keep only this fraction of train cases before L:M:H split.
multires_manifest_path: ""          # optional; leave empty for auto-build
eval_resolution: "H"
Case_Truncate_Ratio: 0.25            # RD: 0.5 / CFD: 0.0

# ----------------------------------------------------------
# Backbone selection
# ----------------------------------------------------------
backbone: "GL_rbf" # Selection in ["mlp_rbf", "perceiver", "fno", "GL_rbf"]

# ----------------------------------------------------------
# Hyperparameters for mlp_rbf backbone
# ----------------------------------------------------------
hidden_dim : 256
cond_dim : 128
field_embed_dim : 128
sigma_min : 1.0e-4    # legacy FFM key; unused in 1-RF, kept only for config compatibility
rbf_sigma : 0.05

USE_FOURIER_PE: true  # If true, mlp_rbf / GL_rbf point_encoder uses Fourier positional coordinate features.
fourier_pe_num_bands: 24  # 24 for RD-mixed and CFD, 32 for RD-H-only
fourier_pe_max_freq: 48   # 48 for for RD-mixed, 32 for CFD-mixed, 48 for CFD-H-only and 64 for RD-H-only

# ----------------------------------------------------------
# Hyperparameters for Perceiver backbone or GL_rbf
# ----------------------------------------------------------
latent_dim: 128
num_latents: 128
num_heads: 8
num_latent_blocks: 4
ff_mult: 4
attn_dropout: 0.0
mlp_dropout: 0.0
decode_chunk_size: 4096
share_query_proj: false

summary_type: "cls" # Only for GL_rbf, mean or cls
gather_mode: "topk_rbf"  # choices: ["rbf", "topk_rbf", "topk_rbf_gate", "topk_rbf_glres"]
gather_topk: 32
gather_query_chunk_size: 1024 # Set as null if gather_mode: "rbf"
learnable_rbf_sigma: true
neighbor_backend: "keops" # choices: ["auto", "torch", "keops"], keops is more efficient

# ----------------------------------------------------------
# Regular-grid specification required by the FNO baseline
# These MUST be provided and must match the dataset, otherwise training will warn and exit.
# ----------------------------------------------------------
Num_x: 128
Num_y: 128
# ----------------------------------------------------------
# Hyperparameters for FNO backbone
# The tensor fed to FNO is shaped [B, C, Num_y, Num_x], so modes are specified separately along x and y.
# FNO now supports grouped mixed-resolution L/M/H batches by inferring each batch grid from coords.
# Its sparse conditioning uses normalized value, support-weighted value, and soft-support maps.
# Retrain FNO checkpoints after this change; older FNO checkpoints are architecture-incompatible.
# ----------------------------------------------------------
fno_modes_x: 16
fno_modes_y: 16
fno_hidden_channels: 64
fno_n_layers: 4
condition_blur: true
condition_blur_kernel: 15
condition_blur_sigma: 2.5

# ----------------------------------------------------------
# These are hyperparameters for the training process
# ----------------------------------------------------------
n_query_points : 1024    # Number of query points to be evaluated in training process
prior : "rff"            # choices=["iid", "rff"]; idd, Independent and Identically Distributed, standard diffusion; RFF, Random Fourier Features
rff_features : 256
rff_lengthscale : 0.15

eval_every : 5
save_every : 500         # Saving reconstruction visualizations after save_every epochs to validate reconstruction quality

# ----------------------------------------------------------
# Setting up the conditioning process
# For PDEBench multi-resolution task, the dataset slices ONE raw field only, 
# so the model-space field index is always 0.
# Here, n_obs_min_list and n_obs_max_list are default for High-Resolution data, 
# and will down scale automatically for others automatically in training
cond_fields: [0]
n_obs_min_list: [512]
n_obs_max_list: [512]

vis_cond_fields:
vis_n_obs_list: [512]
# ----------------------------------------------------------

# ===== Rectified Flow generation controls =====
ode_solver : "euler"
benchmark_n_steps : [2, 4, 8]
