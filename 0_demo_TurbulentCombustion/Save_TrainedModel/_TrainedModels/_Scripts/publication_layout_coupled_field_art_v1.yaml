# Art-style-only Figure 4 revision. Scientific selections and data mappings are
# copied from the validated round-3 baseline; only typography and geometry
# controls differ.
name: CoupledFieldReconstruction
width_in: 7.0866141732  # 180 mm; runtime authority is the art-v1 renderer
height_in: 9.15         # informational; runtime height is content-derived
lower_row_content_height_in: 5.51
outer_middle_width_ratios: [0.40, 0.60]

qualitative:
  snapshot_index: 0
  fields: [CH4, p, U1]
  conditions: [Cond_T, Cond_TU1, Cond_COTU1P]
  proposed_model: DMF-Gen
  generative_preference: [Latent FM, SiT]
  deterministic_preference: [Senseiver, Geo-FNO]
  include_sit_comparison: true
  x_compression: 0.45
  contour_levels: 25
  value_percentiles: [1.0, 99.0]
  robust_error_percentile: 99.0
  reconstruction_to_error_height: [1.0, 1.0]

panel_a_layout_overrides:
  content_height_in: 2.98
  prediction_error_hspace: 0.16
  colorbar_extend: neither
  colorbar_title_loc: left
  master_lower_gap_in: 0.17
  grid_wspace: 0.060
  sit_enabled_grid_wspace: 0.050
  composite_right_pad_ratio: 0.030

typography_overrides_pt:
  size_panel_label: 10.0
  size_subplot_title: 8.5
  size_axis_label: 8.2
  size_tick_label: 8.0
  size_legend: 8.0
  size_annotation: 7.8

composite_layout_overrides:
  # The visible gap is mostly occupied by Panel-d's eight unchanged method
  # labels; the renderer separately verifies a 3-mm content/text corridor.
  panel_wspace_in: 0.94
  bottom_margin_in: 0.40
  composite_margin_left_in: 0.31
  composite_margin_right_in: 0.30
  panel_c_d_gap_in: 0.68

panel_b_layout_overrides:
  condition_hspace: 0.15

panel_c_layout_overrides:
  grid_hspace: 0.30

panel_d_layout_overrides:
  x_label_pad: 1.0
  row_hspace: 0.22
  cond_t_xlabel: "JSD of joint PDF; conditioned on 256 T sensors (0.62% coverage)"
  dmf_first_at_top: true

spectral:
  condition: Cond_T
  snapshot_index: 0
  x_label: "Wavenumber; conditioned on 256 T sensors (0.62% coverage)"
  field_selection: main
  field_options:
    main: [CH4, p, U1]
    y_co_backup: [CH4, CO, U1]
  show_all_models_in_lsd: true

joint_pdf:
  condition: Cond_T
  pair: T-U1
  snapshot_mode: fixed_random_aggregate
  snapshot_count: 5
  snapshot_seed: 42
  fixed_columns: [Ground truth, DMF-Gen, FFM-FNO, FFM-Perceiver, Latent FM, SiT, MLP-RBF, Geo-FNO, Senseiver]

export:
  formats: [pdf, svg, png]
  png_dpi: 600
  tight_pad_inches: 0.10
