# =============================================================================
# GL_rbf_CQ-fast — frozen CQ-LR throughput profile
# =============================================================================
# Choose this profile when training/inference cost matters more than the final
# quality gain of the balanced Stage-7 profile.
# Scientific identity:
#   - latent condition core remains 128-D
#   - query decoder is 128-D, low-rank-64, additive fusion
#   - historical scalar-t conditioning is preserved
#   - Stage-7 measurement/support and EMA are disabled
#   - persistent geometry-only Top-K remains K=32 and unchanged
#
# This is not a debug approximation of GL_rbf_CQ: it is the retained, validated
# CQ-LR efficiency model and has its own expected quality/throughput point.
#
# Quick demonstrations (run from 0_demo_TurbulentCombustion/):
#
#   Validate the public identity and model shape:
#     python scripts/train_pointcloud.py --config configs/gl_rbf_cq_fast.yaml --dry-run
#
#   Train on GPU 1 and write to the configured runs/ directory:
#     CUDA_VISIBLE_DEVICES=1 python scripts/train_pointcloud.py \
#       --config configs/gl_rbf_cq_fast.yaml
#
#   Make a short protocol-preserving screen without changing scheduler horizon:
#     python scripts/train_pointcloud.py --config configs/gl_rbf_cq_fast.yaml \
#       --set epochs=200 --set scheduler_t_max=1000 --demo-num 9801 --device-ids 0
#
#   Reconstruct or evaluate an existing CQ-LR checkpoint:
#     python scripts/reconstruct_pointcloud.py --config configs/gl_rbf_cq_fast.yaml \
#       --checkpoint /path/to/cq_lr_checkpoint.pt --device cuda:0
#     python scripts/evaluate_fixed_manifest.py --config configs/gl_rbf_cq_fast.yaml \
#       --checkpoint /path/to/cq_lr_checkpoint.pt --device cuda:0
# =============================================================================

# -----------------------------------------------------------------------------
# Public identity and run locations
# -----------------------------------------------------------------------------
# Both public CQ profiles map to the historical GL_rbf_ENH_CQ implementation.
# The distinct public name documents which validated feature set is active.
model_name: GL_rbf_CQ-fast
backbone: GL_rbf_ENH_CQ
coord_dim: 3

Demo_Num: 9801
device_ids: [0]
data: Dataset/Merged_COTU0U1P.h5
dataset_stats_path: ReleaseArtifacts/GL_rbf_CQ_rc1/dataset_stats.pt
save_dir: runs/GL_rbf_CQ-fast

# -----------------------------------------------------------------------------
# Reproducibility, optimizer, and schedule
# -----------------------------------------------------------------------------
seed: 42
epochs: 1000
scheduler_t_max: 1000        # Keep at 1000 even for a 200-epoch comparison.
batch_size: 128
lr: 1.0e-4
weight_decay: 1.0e-6
train_ratio: 0.9
time_stride: 1
num_workers: 4

# -----------------------------------------------------------------------------
# Optimized data path
# -----------------------------------------------------------------------------
# Historical alternatives: legacy_clone, legacy_randperm, legacy_gpu, and
# legacy_full transfer. They are retained in the old config for reproduction;
# the public throughput profile uses the validated optimized path below.
data_path_mode: optimized                    # choices: [legacy, optimized]
coord_batch_mode: shared_mesh                # [legacy_clone, shared_mesh]
index_sampling_mode: scalable                # [legacy_randperm, scalable]
sampling_device: cpu                         # [legacy_gpu, cpu]
field_read_mode: legacy_full_snapshot        # [legacy_full_snapshot, indexed_union]
field_normalization_mode: selected_after_full_read  # [legacy_full_after_read, selected_after_full_read]
gpu_transfer_mode: selected_only             # [legacy_full, selected_only]
dataloader_persistent_workers: true
dataloader_prefetch_factor: 2
non_blocking_transfer: true

data_path_diagnostics: true
data_path_diag_storage_mode: append           # [legacy_rewrite, append]
data_path_diag_every_n_steps: 50
data_path_diag_warmup_steps: 5
data_path_diag_max_steps_per_epoch: 10
training_log_every_n_steps: 20
training_history_plot_every_n_epochs: 0

# -----------------------------------------------------------------------------
# Shared GL-RBF sensor/query representation
# -----------------------------------------------------------------------------
hidden_dim: 256
cond_dim: 128
field_embed_dim: 128
sigma_min: 1.0e-4             # Historical compatibility key.
rbf_sigma: 0.05

USE_FOURIER_PE: true
fourier_pe_num_bands: 32
fourier_pe_max_freq: 64.0

# Main capacity difference from balanced GL_rbf_CQ: latent_dim is 128, not 256.
# Query capacity is unchanged because cq_query_dim is 128 in both profiles.
latent_dim: 128
num_latents: 128
num_heads: 8
num_latent_blocks: 4
ff_mult: 4
attn_dropout: 0.0
mlp_dropout: 0.0
decode_chunk_size: 4096
share_query_proj: false
summary_type: mean             # choices: [mean, cls]

# -----------------------------------------------------------------------------
# Local RBF gather and enhanced GLRES condition core
# -----------------------------------------------------------------------------
gather_mode: topk_rbf_glres    # [rbf, topk_rbf, topk_rbf_gate, topk_rbf_ptlocal, topk_rbf_glres]
gather_topk: 32                # Validated persistent-cache contract.
sensor_local_topk: 16
gather_query_chunk_size: 2048
learnable_rbf_sigma: true
neighbor_backend: keops        # choices: [auto, torch, keops]
sensor_local_dropout: 0.0

sensor_coord_encoding: fourier
latent_sensor_reinject: true
latent_reinject_every: 1

# Stage-8 preferred CQ execution. The frozen fast-profile architecture remains
# unchanged; only redundant sensor K/V projection work is removed.
condition_attention_execution: cached_kv
sensor_attention_padding_mode: full

# Compatibility/debug override:
#   condition_attention_execution: legacy_mha
# Static bucketing and dynamic trimming remain unpromoted diagnostics.

query_latent_readout: true
query_readout_type: coord
query_readout_scale_init: 1.0e-2
enhanced_head_norm: true
glres_scale_init: 1.0e-2

# -----------------------------------------------------------------------------
# Compact Query decoder — historical CQ-LR behavior
# -----------------------------------------------------------------------------
cq_query_dim: 128
cq_readout_mode: lowrank       # choices: [full, lowrank]
cq_readout_rank: 64
cq_readout_heads: 4
cq_fusion_mode: additive       # Keep additive for CQ-LR checkpoint compatibility.
cq_global_scale_init: 1.0
cq_local_scale_init: 1.0
cq_readout_scale_init: 1.0e-2

# These three lines are the important difference from balanced Stage 7:
cq_time_conditioning: scalar_concat  # historical scalar t concatenated to point state
cq_measurement_support_mode: none    # no explicit raw measurement/support features
model_ema_enabled: false             # validation/reconstruction use live weights

# Defaults retained explicitly so copied configs do not inherit surprising EMA behavior.
model_ema_decay: 0.999
model_ema_eval: false

# -----------------------------------------------------------------------------
# Rectified-flow training query path and prior
# -----------------------------------------------------------------------------
n_query_points: 4096
train_query_microbatch_size: null     # CQ-LR reference used monolithic Q4096.
reuse_condition_context_across_query_microbatches: true
query_sampling: uniform              # choices: [uniform, obs_mix]
query_sample_near_ratio: 0.25        # Used only by obs_mix.
query_sample_far_ratio: 0.25
query_sample_sigma_ratio: 0.05

prior: rff                           # choices: [iid, rff]
rff_features: 256
rff_lengthscale: 0.15

# -----------------------------------------------------------------------------
# Sparse conditioning demonstration
# -----------------------------------------------------------------------------
# Dataset field order: 0=CO, 1=T, 2=U_0, 3=U_1, 4=p.
cond_fields: [1]                     # Temperature-only conditioning.
n_obs_min_list: [192]
n_obs_max_list: [384]

# Example multi-field layout (commented):
#   cond_fields: [0, 2, 4]
#   n_obs_min_list: [128, 128, 64]
#   n_obs_max_list: [256, 256, 128]
vis_cond_fields: [1]
vis_n_obs_list: [256]

# -----------------------------------------------------------------------------
# Reconstruction, validation, and checkpoint retention
# -----------------------------------------------------------------------------
reconstruction_execution_mode: cached_streamed  # [legacy_full, cached_streamed]
reconstruction_query_chunk_size: 8192
reconstruction_cache_level: static_features     # [none, geometry, static_features]

ode_solver: euler                 # choices: [euler, heun]
benchmark_n_steps: [1, 2, 4]
eval_every: 5
save_every: 1000
checkpoint_epochs: [1, 20, 40, 60, 100, 200, 400, 600, 800, 1000]
n_steps_generation: 32
