# GL_rbf_CQ v0.9 portable model/execution defaults.
# Merge this mapping with a downstream project's dataset, field, optimizer,
# sampling, and output configuration. No demo paths or field choices live here.

# Public/checkpoint identity
model_name: GL_rbf_CQ
backbone: GL_rbf_ENH_CQ
coord_dim: 3                    # Override to 2 for planar downstream coordinates.

# Rectified-flow wrapper and source prior
sigma_min: 1.0e-4
prior: rff
rff_features: 256
rff_lengthscale: 0.15

# Shared point/sensor representation
hidden_dim: 256
cond_dim: 128
field_embed_dim: 128
rbf_sigma: 0.05
USE_FOURIER_PE: true
fourier_pe_num_bands: 32
fourier_pe_max_freq: 64.0

# Sensor/global latent core
latent_dim: 256
num_latents: 128
num_heads: 8
num_latent_blocks: 4
ff_mult: 4
attn_dropout: 0.0
mlp_dropout: 0.0
summary_type: mean
sensor_coord_encoding: fourier
latent_sensor_reinject: true
latent_reinject_every: 1

# Stage-8 preferred execution; legacy_mha remains a compatibility/debug choice.
condition_attention_execution: cached_kv
sensor_attention_padding_mode: full

# Local RBF/GLRES path and persistent geometry contract
gather_mode: topk_rbf_glres
gather_topk: 32
gather_query_chunk_size: 2048
learnable_rbf_sigma: true
neighbor_backend: keops          # Override to torch when KeOps is unavailable.
sensor_local_topk: 16
sensor_local_dropout: 0.0
query_latent_readout: true
query_readout_type: coord
query_readout_scale_init: 1.0e-2
enhanced_head_norm: true
glres_scale_init: 1.0e-2

# Frozen compact-query decoder
cq_query_dim: 128
cq_readout_mode: lowrank
cq_readout_rank: 64
cq_readout_heads: 4
cq_fusion_mode: additive
cq_global_scale_init: 1.0
cq_local_scale_init: 1.0
cq_readout_scale_init: 1.0e-2

# Stage-7 condition/RF features
cq_time_conditioning: sinusoidal_film
cq_time_embed_dim: 128
cq_time_max_period: 10000.0
cq_time_film_zero_init: true
cq_measurement_support_mode: rbf_value_support
cq_measurement_support_normalize: true
model_ema_enabled: true
model_ema_decay: 0.999
model_ema_eval: true

# Model-side query/reconstruction execution defaults
train_query_microbatch_size: 2048
reuse_condition_context_across_query_microbatches: true
reconstruction_execution_mode: cached_streamed
reconstruction_query_chunk_size: 8192
reconstruction_cache_level: static_features
ode_solver: euler
