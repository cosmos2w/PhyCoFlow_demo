schema_version: 1
release:
  name: GL_rbf_CQ portable core preparation
  version: 0.9.0-pre1
  status: pre_release
  branch: release/gl-rbf-cq-portable-prep
  scientific_architecture_frozen: true
  weights_frozen: true

source:
  stage8_tip_sha: 7b5dd2df672a86d5b5cf2502b93208786d282e17
  stage8_code_tag: gl-rbf-cq-v0.9.0-rc2
  stage8_code_tag_commit: f8d57153c268a0e03c941092dffc921898d58d61
  release_weight_tag: gl-rbf-cq-v0.9.0-rc1
  public_model_name: GL_rbf_CQ
  historical_backbone_name: GL_rbf_ENH_CQ

defaults:
  model_config: configs/gl_rbf_cq_core.yaml
  condition_attention_execution: cached_kv
  sensor_attention_padding_mode: full
  historical_missing_key_fallback:
    condition_attention_execution: legacy_mha
    sensor_attention_padding_mode: full

portable_core_files:
  - src/phycoflow_pointcloud/__init__.py
  - src/phycoflow_pointcloud/checkpointing.py
  - src/phycoflow_pointcloud/config.py
  - src/phycoflow_pointcloud/priors.py
  - src/phycoflow_pointcloud/observation.py
  - src/phycoflow_pointcloud/reconstruction.py
  - src/phycoflow_pointcloud/training.py
  - src/phycoflow_pointcloud/evaluation.py
  - src/phycoflow_pointcloud/cache/__init__.py
  - src/phycoflow_pointcloud/cache/geometry.py
  - src/phycoflow_pointcloud/models/__init__.py
  - src/phycoflow_pointcloud/models/portable_core.py
  - src/phycoflow_pointcloud/models/gl_rbf_core.py
  - src/phycoflow_pointcloud/models/gl_rbf_cq.py
  - src/phycoflow_pointcloud/models/gl_rbf_enh.py
  - src/phycoflow_pointcloud/models/query_readout.py
  - src/phycoflow_pointcloud/models/ema.py
  - src/phycoflow_pointcloud/models/factory.py

compatibility_files:
  - path: src/Model.py
    purpose: historical class/import names re-export the portable GL-RBF/CQ classes
  - path: src/persistent_topk_geometry_cache.py
    purpose: historical persistent-cache import shim
  - path: src/obs_consistency.py
    purpose: historical observation-consistency import shim
  - path: src/model_ema.py
    purpose: historical ModelEMA import shim

demo_only_files:
  - src/_legacy_model_full.py
  - src/helpers.py
  - src/pointcloud_data_path.py
  - src/pointcloud_eval_manifest.py
  - src/train_pointcloud_ffm.py
  - src/reconstruct_pointcloud.py
  - src/evaluate_fixed_manifest.py
  - src/evaluate_pointcloud_fixed_manifest.py
  - configs/gl_rbf_cq.yaml
  - configs/gl_rbf_cq_fast.yaml
  - configs/legacy_gl_rbf_enh.yaml
  - _CheckNotes/
  - research/

release_checkpoint:
  path: ReleaseArtifacts/GL_rbf_CQ_rc1/GL_rbf_CQ_v0.9.0-rc1_e1000_ema_resolved_portable.pt
  sha256: 2516ffeb45775d4e6b8d88b4b24d927aac28665a2a90102583e07deaca78f64d
  resolved_state_sha256: f1c92d4bcf1b9e0ac90ad20b3b3468764f6cca200dde1575b914d9ab68d7b99f
  epoch: 1000
  global_step: 71000
  state_key_count: 148
  state_schema_sha256: f221ee2b26268fe64e116f9f57165d34aac9ff524202e40d225ed17f76dc970e
  weights: ema_resolved
  intended_use: inference_and_strict_load_equivalence

environment:
  python: ">=3.10"
  required:
    - PyTorch with scaled_dot_product_attention support
    - PyYAML for YAML configuration loading
  optional:
    - pykeops for neighbor_backend=keops
  fallback:
    neighbor_backend: torch
  forbidden_core_dependencies:
    - turbulent-combustion HDF5 loader
    - helpers.py
    - neuralop baseline models
    - visualization stack
    - coherence analysis stack

public_python_api:
  model_factory: phycoflow_pointcloud.build_pointcloud_model
  model_class: phycoflow_pointcloud.GL_rbf_CQ
  flow_wrapper: phycoflow_pointcloud.PointCloudFFM
  training_loss: phycoflow_pointcloud.rectified_flow_loss
  training_loss_microbatched: phycoflow_pointcloud.rectified_flow_loss_microbatched
  reconstruction: phycoflow_pointcloud.reconstruct_from_tensors
  persistent_cache: phycoflow_pointcloud.cache.build_persistent_topk_geometry_cache
  checkpoint_resolution: phycoflow_pointcloud.resolve_checkpoint_state

demo_entry_points:
  train: src/train_pointcloud_ffm.py
  reconstruct: src/reconstruct_pointcloud.py
  fixed_manifest_evaluate: src/evaluate_fixed_manifest.py

verification:
  isolated_portability_test: tests/test_portable_core.py
  full_regression_command: pytest -q
  downstream_project_prepared_not_executed: Proj_MultiFieldReconstruction
