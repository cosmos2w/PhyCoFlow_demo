# =============================================================================
# Unified Generative Baseline Configuration
# -----------------------------------------------------------------------------
# This file is the single entry point for all baseline training/evaluation.
#
# Required selectors:
#   baseline_model : s3gm | latent_fm | sit
#   training_stage : 1 | 2
#
# Stage rules:
#   - s3gm      : only stage 1 is valid
#   - sit       : only stage 1 is valid
#   - latent_fm : stage 1 = autoencoder, stage 2 = latent flow matching

# =============================================================================

baseline_model: "sit"  # `s3gm`, `latent_fm`, and `sit`.
training_stage: 1

# Shared/global values of all baselines live under `shared`.
shared:
  demo_num: 0
  seed: 42
  device_ids: [1]
  reload: false

  paths:
    data_path: "Dataset/Merged_CH4COTU1P.h5"
    save_root: "Save_TrainedModel"
    config_backup_root: "Save_config/gen_baseline"

  data:
    dataset_name: "turbulent_combustion"
    train_ratio: 0.9
    time_stride: 1
    num_workers: 4
    num_x: 403
    num_y: 100

  conditioning:
    # SiT baseline launch variants. Field IDs:
    #   0: CH4, 1: CO, 2: T, 3: U_1, 4: p
    #
    # A. T only:
    #   cond_fields: [2]
    #   n_obs_min_list: [192]
    #   n_obs_max_list: [384]
    #   vis_cond_fields: [2]
    #   vis_n_obs_list: [256]
    #
    # B. T and U_1:
    #   cond_fields: [2, 3]
    #   n_obs_min_list: [192, 192]
    #   n_obs_max_list: [384, 384]
    #   vis_cond_fields: [2, 3]
    #   vis_n_obs_list: [256, 256]
    #
    # C. CO, T, U_1, and p:
    #   cond_fields: [1, 2, 3, 4]
    #   n_obs_min_list: [192, 192, 192, 192]
    #   n_obs_max_list: [384, 384, 384, 384]
    #   vis_cond_fields: [1, 2, 3, 4]
    #   vis_n_obs_list: [256, 256, 256, 256]
    cond_fields: [2]
    n_obs_min_list: [192]
    n_obs_max_list: [384]
    vis_cond_fields: [2]
    vis_n_obs_list: [256]

  logging:
    eval_every: 5
    save_every: 500

  # Optional global training overrides.
  # Leave as null to preserve the original per-model defaults below.
  overrides:
    epochs:
    batch_size:
    learning_rate:
    weight_decay:

s3gm_params:
  training:
    epochs: 10000
    batch_size: 24
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 200

  architecture:
    nf: 64
    ch_mult: [1, 2, 4, 8]
    num_res_blocks: 2
    attn_resolutions: [8]
    num_heads: 1
    dropout: 0.1
    use_checkpoint: false

  diffusion:
    sigma_min: 0.1
    sigma_max: 7.0
    num_scales: 1000
    ema_rate: 0.999

  sampling:
    sampling_N: 200
    snr: 0.128
    n_corrector_steps: 5
    alpha_obs: 1.0
    benchmark_n_steps: [200]

latent_fm_params:
  stage1:
    training:
      epochs: 5000
      batch_size: 128
      learning_rate: 1.0e-4
      weight_decay: 1.0e-6
      eval_every: 5
      save_every: 200

    architecture:
      base_ch: 64
      latent_ch: 128
      n_levels: 3

  stage2:
    # Leave null to auto-discover the latest stage-1 best checkpoint.
    stage1_checkpoint:

    training:
      epochs: 10000
      batch_size: 64
      learning_rate: 2.0e-4
      weight_decay: 0.0
      eval_every: 5
      save_every: 200

    architecture:
      base_ch: 64
      ch_mult: [1, 2, 4, 8]
      num_res_blocks: 2
      num_heads: 8
      ema_decay: 0.999

    conditioning:
      cond_mode: "image"
      pointnet_hidden_mult: 1.0

    sampling:
      ode_solver: "euler"
      benchmark_n_steps: [2, 4, 8, 16]

sit_params:
  training:
    epochs: 10000
    batch_size: 32
    learning_rate: 5.0e-5
    weight_decay: 0.0001
    eval_every: 5
    save_every: 500
    adam_eps: 1.0e-6
    huber_beta: 0.1

  architecture:
    patch_size: 4
    hidden_size: 256
    depth: 8
    num_heads: 4
    mlp_ratio: 4.0
    tokenizer: "patch"
    coord_dim: 2
    fourier_num_freqs: 64
    fourier_scale: 10.0
    ema_rate: 0.9999

  transport:
    path_type: "Linear"
    prediction: "velocity"
    loss_weight:

  conditioning:
    cond_mode: "interp"

  sampling:
    sampling_N: 50
    ode_solver: "euler"
    benchmark_n_steps: [4, 16, 32, 64]
