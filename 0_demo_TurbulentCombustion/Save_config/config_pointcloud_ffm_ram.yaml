# ------------------------------------------------------------
# RAM fine-tuning config for PointCloudFFM in TurbulentCombustion
# Model architecture is loaded from source_run_dir/run_config.yaml.
# ------------------------------------------------------------

Demo_Num: 0
seed: 42
device_ids: [1]

# Source pretrained run.
# If source_run_dir is null, train_finetune.py finds the latest source_Demo_Num run.
source_run_dir: null
source_Demo_Num: 15
source_checkpoint: "last"

data: "Dataset/Merged_CH4COTU1P.h5"
train_ratio: 0.9
# Fine-tuning epoch downsampling. The train/val/test split still uses
# train_ratio above; this only draws a fresh random fraction of train cases each
# RAM epoch to shorten fine-tuning passes.
train_ratio_downsample: 0.50
time_stride: 1
num_workers: 4

save_dir: "Save_TrainedModel/ram_tc_pointcloud"

# Sparse observations. If null, inherit from source config.
cond_fields: null
n_obs_min_list: null
n_obs_max_list: null

# Endpoint sampling from old EMA policy.
ram_endpoint_steps: 4
ode_solver: "euler"
ram_obs_consistency_mode: "endpoint_smooth"
obs_consistency_strength: 1.0
obs_consistency_sigma: 0.05
obs_consistency_schedule_power: 2.0
obs_consistency_final_clamp: true

# RAM batch structure.
ram_epochs: 10000
max_train_batches: null
batch_size: 64
num_samples_per_condition: 4
num_loss_targets_per_endpoint: 4

# RAM memory controls.
# Endpoint rewards remain full-grid, while velocity matching uses a query subset
# like base PointCloudFFM training.
ram_n_query_points: 2048
ram_query_sampling: "obs_mix"
ram_query_sample_near_ratio: 0.25
ram_query_sample_far_ratio: 0.25
ram_query_sample_sigma_ratio: 0.05
# Increase these two if GPU memory allows. The endpoint microbatch is typically the main bottleneck, as it processes full-grid samples and feeds them into the reward model.
ram_endpoint_microbatch_size: 64
ram_loss_microbatch_size: 128

# PhyCoFlow convention: t=0 source/noise, t=1 clean.
# mirrored_weighted samples p(t)=2(1-t), emphasizing noisy/source-side states.
timestep_sampling: "mirrored_weighted"
t_eps: 1.0e-3

# Reward/coherence: reward_multiplier is the KEY parameter !!!
reward_mode: "global_dist"
reward_multiplier: 0.10
reward_scaling: "running_epoch_std"
reward_eps: 1.0e-4
adv_clip_abs: null
coherence_use_denorm: false

# Global distributional coherence.
global_lambda_marg: 1.0
global_lambda_joint: 1.0
global_num_directions: 64
global_joint_top_frac: 0.10
# Pairwise SWD is useful but expensive across many full-grid endpoints. Keep it
# off testing RAM runs & enable only after the core RAM signal is stable.
global_include_pairwise: false
global_lambda_pairwise: 0.25
global_include_pairwise_in_score: false

# Optimizer.
lr: 2.0e-5
weight_decay: 1.0e-4
beta1: 0.9
beta2: 0.99
grad_clip: 1.0

# EMA policies.
old_ema_decay: 0.9
eval_ema_decay: 0.99

# Fine-tuning modes:
#   head_glres = safe adaptation for GL_rbf/topk_rbf_glres
#   all        = full model fine-tuning
finetune_mode: "head_glres"

# Logging / validation.
val_loss_rel_l2_weight: 1.0
val_loss_coherence_weight: 0.1
eval_every: 5
save_every: 20
n_steps_generation_eval: 4
eval_num_batches: 2

# Optional fixed clean rollout monitor. Runs at epoch 0 before fine-tuning.
rollout_eval_enabled: true
rollout_eval_every: 20
rollout_eval_split: "test"
rollout_eval_snapshot_index: 0
rollout_eval_n_steps: 2
rollout_eval_obs_consistency_mode: "endpoint_smooth"
rollout_eval_num_sensors: null
rollout_eval_save_fields: true
