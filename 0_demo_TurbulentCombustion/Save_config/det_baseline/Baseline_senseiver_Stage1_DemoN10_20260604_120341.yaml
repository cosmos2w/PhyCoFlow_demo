# =============================================================================
# Unified Deterministic Baseline Configuration
# -----------------------------------------------------------------------------
# Required selectors:
#   baseline_model : mlp_rbf | senseiver | geofno
#   training_stage : 1
#
# MLP-RBF uses the original FFM point MLP + RBF sparse-gather backbone in
# direct supervised mode.
# Senseiver is a Perceiver-IO sparse-sensor regressor.
# Geo-FNO is a supervised neuraloperator FNO sparse-observation regressor.
# =============================================================================

# =============================================================================

# NOTE: demo 0 is for senseiver conditioned on T and U_1 with 192-384 sensors per field, and 256 sensors for visualization. This is the most comparable setting to the original pointcloud FFM Perceiver baseline, which also used T and U_1 conditioning with 256 sensors per field. Demo 1 is for senseiver conditioned on T only, with the same sensor counts as demo 0. Demo 2 and demo 3 are for the same conditioning setups as demos 0 and 1, but with the original pointcloud FFM Perceiver backbone replaced by the MLP-RBF backbone, to isolate the effect of the backbone architecture change. Demo 4 is for the Geo-FNO baseline with T-only conditioning.
# Testing case for Senseiver - latent_dime 128
# =============================================================================

baseline_model: "senseiver"  # `mlp_rbf`, `senseiver`, or `geofno`.
training_stage: 1

shared:
  demo_num: 10
  seed: 42
  device_ids: [2]
  reload: false

  paths:
    data_path: "Dataset/Merged_CH4COTU1P.h5"
    save_root: "Save_TrainedModel"
    config_backup_root: "Save_config/det_baseline"

  data:
    dataset_name: "turbulent_combustion"
    train_ratio: 0.9
    time_stride: 1
    num_workers: 4
    num_x: 403
    num_y: 100

  conditioning:
    # Match the unified generative baseline defaults for fair comparison.
    # Field IDs:
    #   0: CH4, 1: CO, 2: T, 3: U_1, 4: p
    #
    # A. T only:
    #   cond_fields: [2]
    #   n_obs_min_list: [192]
    #   n_obs_max_list: [384]
    #   vis_cond_fields: [2]
    #   vis_n_obs_list: [256]
    #
    # B. T and U_1:
    #   cond_fields: [2, 3]
    #   n_obs_min_list: [192, 192]
    #   n_obs_max_list: [384, 384]
    #   vis_cond_fields: [2, 3]
    #   vis_n_obs_list: [256, 256]
    #
    # C. CO, T, U_1, and p:
    #   cond_fields: [1, 2, 3, 4]
    #   n_obs_min_list: [192, 192, 192, 192]
    #   n_obs_max_list: [384, 384, 384, 384]
    #   vis_cond_fields: [1, 2, 3, 4]
    #   vis_n_obs_list: [256, 256, 256, 256]

    cond_fields: [2, 3]  # "0:CH4, 1:CO, 2:T, 3:U_1, 4:p"
    n_obs_min_list: [192, 192]
    n_obs_max_list: [384, 384]
    vis_cond_fields: [2, 3]
    vis_n_obs_list: [256, 256]

  logging:
    eval_every: 5
    save_every: 500

  # Optional global training overrides.
  # Leave as null to preserve the original per-model defaults below.
  overrides:
    epochs:
    batch_size:
    learning_rate:
    weight_decay:

mlp_rbf_params:
  training:
    epochs: 10000
    batch_size: 128
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 500
    n_query_points: 4096

  architecture:
    # Match current pointcloud FFM MLP-RBF defaults.
    coord_dim: 3
    hidden_dim: 256
    cond_dim: 128
    field_embed_dim: 128
    rbf_sigma: 0.05
    use_fourier_pe: true
    fourier_pe_num_bands: 32
    fourier_pe_max_freq: 64.0

senseiver_params:
  training:
    epochs: 10000
    batch_size: 128
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 500
    n_query_points: 4096

  architecture:
    coord_dim: 2
    num_latents: 128
    latent_dim: 128
    num_encoder_layers: 3
    num_self_attn_per_block: 3
    num_cross_attn_heads: 8
    num_self_attn_heads: 8
    dec_num_cross_attn_heads: 8
    field_embed_dim: 32
    space_bands: 32
    max_freq: 64.0
    ff_mult: 4
    dropout: 0.0

geofno_params:
  training:
    epochs: 10000
    # Full-grid supervised updates are memory heavier than point-query updates.
    batch_size: 128
    learning_rate: 1.0e-4
    weight_decay: 1.0e-6
    eval_every: 5
    save_every: 500

  architecture:
    geofno_variant: "fno"  # `fno` for structured grid, `irregular` for splat/gather.
    # Match the current FFM-FNO launch defaults on this dataset.
    fno_modes_x: 24
    fno_modes_y: 12
    fno_hidden_channels: 64
    fno_n_layers: 4

    # Used only when geofno_variant: "irregular".
    latent_Nx: 64
    latent_Ny: 64
    gno_radius: 0.1
    gno_transform_type: "linear"
