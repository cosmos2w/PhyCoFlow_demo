# Matched 100-epoch Round-1 comparison: candidate data path on physical GPU 1.
Demo_Num: 9012
device_ids: [1]
data: "Dataset/Merged_COTU0U1P.h5"
dataset_stats_path: "Save_TrainedModel/ffm_tc_pointcloud_DemoN51_20260718_083538/dataset_stats.pt"
save_dir: "_CheckNotes/Round1_runs/optimized/ffm_tc_pointcloud"

seed: 42
epochs: 100
batch_size: 144
lr: 1.0e-4
weight_decay: 1.0e-6
train_ratio: 0.9
time_stride: 1
num_workers: 4

data_path_mode: "optimized"
coord_batch_mode: "shared_mesh"
index_sampling_mode: "scalable"
sampling_device: "cpu"
field_read_mode: "legacy_full_snapshot"
gpu_transfer_mode: "selected_only"
dataloader_persistent_workers: true
dataloader_prefetch_factor: 2
non_blocking_transfer: true
data_path_diagnostics: false
training_log_every_n_steps: 20
training_history_plot_every_n_epochs: 0

backbone: "GL_rbf_ENH"
hidden_dim: 256
cond_dim: 128
field_embed_dim: 128
sigma_min: 1.0e-4
rbf_sigma: 0.05
USE_FOURIER_PE: true
fourier_pe_num_bands: 32
fourier_pe_max_freq: 64.0
latent_dim: 128
num_latents: 128
num_heads: 8
num_latent_blocks: 4
ff_mult: 4
attn_dropout: 0.0
mlp_dropout: 0.0
decode_chunk_size: 4096
share_query_proj: false
summary_type: "mean"
gather_mode: "topk_rbf_glres"
gather_topk: 32
sensor_local_topk: 16
gather_query_chunk_size: 2048
learnable_rbf_sigma: true
neighbor_backend: "keops"
sensor_local_dropout: 0.0
sensor_coord_encoding: "fourier"
latent_sensor_reinject: true
latent_reinject_every: 1
query_latent_readout: true
query_readout_type: "coord"
query_readout_scale_init: 1.0e-2
enhanced_head_norm: true
glres_scale_init: 1.0e-2

n_query_points: 4096
query_sampling: "uniform"
query_sample_near_ratio: 0.25
query_sample_far_ratio: 0.25
query_sample_sigma_ratio: 0.05
prior: "rff"
rff_features: 256
rff_lengthscale: 0.15
cond_fields: [1]
n_obs_min_list: [192]
n_obs_max_list: [384]
vis_cond_fields: [1]
vis_n_obs_list: [256]

# Only matched validation at epochs 1 and 100; no reconstruction visualizations.
eval_every: 100
save_every: 1000
n_steps_generation: 32
ode_solver: "euler"
benchmark_n_steps: [1, 2, 4]
