# Figure 5 V5.1 panel-c exploration contract.
#
# This file is intentionally additive.  It does not alter the accepted V2--V5
# configurations or any formal source bundle.  Selection rules in this file are
# written before any new model output is read; output-specific ranking is never
# used to choose a state, field, threshold or location.
schema_version: figure5-v51-panel-c-exploration-1
timestamp: '20260902_1129'

dataset: turbulent_combustion
task: missing_channel_reconstruction
condition: Cond_T
sensor_count: 256
native_query_count: 40300
dtype: float32
fields:
  all: [Y_CH4, Y_CO, T, U1, p]
  unobserved: [Y_CH4, Y_CO, U1, p]
methods: [DMF-Gen, FFM-FNO, FFM-Perceiver, Latent FM, SiT]

# The same adopted conditional checkpoints and sensor plan as V3/V5 are used.
# Hashes are checked from validation_v1.yaml and the formal V3 manifest before
# any result table is consumed.
validation_plan: 0_demo_TurbulentCombustion/Save_TrainedModel/_TrainedModels/_ValidationPlans/validation_v1.yaml
v3_uq_root: Dis_SI_Process/results/ValidationV3/UQCompare/uq_compare_formal_20260830_v3r6
v3_state_table: Dis_SI_Process/results/ValidationV3/UQCompare/uq_compare_formal_20260830_v3r6/per_state_method.csv
v3_uq_manifest: Dis_SI_Process/results/ValidationV3/UQCompare/uq_compare_formal_20260830_v3r6/manifest.json
v3_uq_qa: Dis_SI_Process/results/ValidationV3/UQCompare/uq_compare_formal_20260830_v3r6/qa.json
formal_accuracy_summary: 0_demo_TurbulentCombustion/Save_TrainedModel/_TrainedModels/_Process_Results/FieldL2/FieldL2_summary_paper_full_20260711.csv
fig4_state_source: 0_demo_TurbulentCombustion/Save_TrainedModel/_TrainedModels/_Scripts/publication_layout_coupled_field_round3_spacing.yaml
fig4_state_test_index: 0
fig4_state_original_time_index: 5

bootstrap:
  unit: state
  time_order: original_hdf5_time_index
  method: temporal_moving_block_bootstrap
  block_length: 25
  replicates: 2000
  confidence_level: 0.95
  seed: 20260830

panel_c:
  # C1 uses the exact paired 200-state V3 table.  A state is retained when its
  # macro normalized ensemble spread is among the lowest values, i.e. low-risk
  # triage.  No model output is inspected to define the grid.
  c1:
    coverage_fractions: [0.20, 0.30, 0.40, 0.50, 0.60, 0.70, 0.80, 0.90, 1.00]
    ranking: ascending_macro_normalized_ensemble_spread
    response: macro_ensemble_mean_relative_l2
    normalized_response: divide_by_same_sample_full_coverage_risk
    bootstrap_recompute_ranking: true
    auc_definition: trapezoid_over_evaluated_grid_0.20_to_1.00
    normalized_display_ylim:
      rule: finite_bootstrap_ci_min_with_declared_padding; upper_bound_is_max_of_finite_ci_plus_padding_and_1.02
      lower_padding_fraction: 0.05
      upper_padding_fraction: 0.02
      upper_floor: 1.02

  # C2--C4 all use one predeclared held-out state.  Figure 4's accepted
  # round-3 qualitative source uses test index 0, which maps to original HDF5
  # time index 5 in the frozen validation plan and is in the V3 cohort.
  fixed_state:
    test_index: 0
    original_hdf5_time_index: 5
    mapping_rule: exact_fig4_round3_state; no_nearest_state_substitution
  ch4_interface:
    field: Y_CH4
    motivation: always_unobserved_methane_interface_under_temperature_only_conditioning
    threshold_rule: 0.5_times_training_split_Y_CH4_q99_physical
    signed_distance_sign: positive_on_Y_CH4_ge_threshold_side
    signed_distance_coordinate: Euclidean_distance_in_normalized_coordinate_domain
    profile_bin_edges: [-0.25, -0.2375, -0.225, -0.2125, -0.20, -0.1875, -0.175, -0.1625, -0.15, -0.1375, -0.125, -0.1125, -0.10, -0.0875, -0.075, -0.0625, -0.05, -0.0375, -0.025, -0.0125, 0.0, 0.0125, 0.025, 0.0375, 0.05, 0.0625, 0.075, 0.0875, 0.10, 0.1125, 0.125, 0.1375, 0.15, 0.1625, 0.175, 0.1875, 0.20, 0.2125, 0.225, 0.2375, 0.25]
    minimum_points_per_bin: 32
    bands: {central: 0.50, outer: 0.90}
    crps_scale: training_split_Y_CH4_std_physical
    front_location_bias: mean_profile_threshold_crossing_signed_distance
    profile_aggregation: equal_point_weight_within_bin
  c3_locations:
    state: fixed_state
    locations:
      - id: interface_max_gradient
        rule: truth_only_argmax_abs_gradient_Y_CH4; tie_break_lowest_flat_index
      - id: fuel_rich
        rule: truth_Y_CH4_nearest_training_split_q90_with_distance_from_interface_at_least_0.05
      - id: fuel_lean
        rule: truth_Y_CH4_nearest_training_split_q10_with_distance_from_interface_at_least_0.05
    minimum_interface_distance: 0.05
    pointwise_draw_count: 64
    x_limits: per_location_truth_and_draw_quantiles_0.005_to_0.995_expanded_5_percent
    density: empirical_histogram_or_kde_for_display_only; no_synthetic_draws
  c4_functionals:
    state: fixed_state
    threshold_source: ch4_interface.threshold_rule
    functionals:
      - id: methane_inventory
        symbol: M_CH4
        definition: mean_over_domain_Y_CH4
        weighting: equal_point_weight_no_cell_area_source_available
      - id: methane_rich_area_fraction
        symbol: A_CH4
        definition: fraction_of_domain_points_with_Y_CH4_gt_threshold
        weighting: equal_point_weight_no_cell_area_source_available
    c4b_residual_standardization: training_split_functional_mean_and_std
    pointwise_draw_count: 64
  c2b_overlay_comparator:
    rule: lowest_frozen_Figure4_mean_unobserved_relative_l2_among_non_DMF_generators
    expected_method_from_frozen_source: SiT

  pointwise_protocol:
    required_draws: 64
    generation_seed_schedule: "stable_seed(20260830,'generation','U2',state,draw); shared across methods"
    sensor_plan: exact_adopted_256_temperature_rows
    query_count: 40300
    stream_one_state_method_at_a_time: true
    reduce_immediately: true
    save_full_draws: false
    inference_execution: gated_until_explicit_GPU2_availability_confirmation
    method_inference_overrides:
      DMF-Gen: {n_steps: 2, solver: euler, measured_nfe: 2, obs_consistency_requested: default_hard, obs_consistency_applied: default_hard, execution_mode: cached_streamed, cache_level: static_features}
      FFM-FNO: {n_steps: 2, solver: heun_native, measured_nfe: 4, obs_consistency_requested: endpoint_smooth, obs_consistency_applied: endpoint_smooth, execution_mode: legacy_full, cache_level: none}
      FFM-Perceiver: {n_steps: 2, solver: euler, measured_nfe: 2, obs_consistency_requested: endpoint_smooth, obs_consistency_applied: endpoint_smooth, execution_mode: legacy_full, cache_level: none}
      Latent FM: {n_steps: 2, solver: euler, measured_nfe: 2, obs_consistency_requested: endpoint_smooth, obs_consistency_applied: native_not_applied, execution_mode: legacy_full, cache_level: none}
      SiT: {n_steps: 4, solver: euler, measured_nfe: 4, obs_consistency_requested: endpoint_smooth, obs_consistency_applied: native_not_applied, execution_mode: legacy_full, cache_level: none}
    settings_source: canonical_postprocess_config_and_V3_method_draw_audit

outputs:
  result_root: Dis_SI_Process/results/ValidationV51/PanelC
  result_run_id: panel_c_exploration_20260902_1129
  figure_root: Dis_SI_Process/figures/exploration/figure5_v51/20260902_1129/panel_c_candidates
  docs_root: Dis_SI_Process/docs/exploration/figure5_v51/20260902_1129/panel_c_candidates
  c0_svg: Dis_SI_Process/figures/generated/20260831_1409/fig5c_spatial_error_capture_v5_20260831_1409.svg
  c0_source: Dis_SI_Process/results/ValidationV5/UQLocalization/uq_localization_formal_v5/error_capture_summary.csv
  svg_only: true

style:
  font_family: [Arial, DejaVu Sans, Liberation Sans]
  method_colors:
    DMF-Gen: '#E63946'
    FFM-FNO: '#1D3557'
    FFM-Perceiver: '#457B9D'
    Latent FM: '#6A4C93'
    SiT: '#A28BC4'
  method_markers:
    DMF-Gen: o
    FFM-FNO: s
    FFM-Perceiver: D
    Latent FM: ^
    SiT: v
