evidence_policy:
  forbid_filesystem_mtime: true
  # Only explicit values in checkpoint metadata or declared text/JSON/YAML
  # evidence files may populate these fields.  A run-name/filename timestamp,
  # filesystem ctime/mtime, or config epoch target is not wall-clock evidence.
  wall_clock_keys:
    - wall_clock_seconds
    - elapsed_seconds
    - duration_seconds
    - training_seconds
    - train_seconds
    - wall_clock_hours
    - elapsed_hours
    - duration_hours
    - start_time
    - started_at
    - start_timestamp
    - end_time
    - finished_at
    - end_timestamp
  update_count_sources:
    - checkpoint.global_step
    - checkpoint.optimizer.state[*].step
  gpu_identity_sources:
    - declared_training_manifest
    - declared_training_log
    - declared_scheduler_metadata
  config_device_ids_are_not_hardware_identity: true

promotion:
  preferred_metric: total_gpu_hours
  allowed_fallback_metric: training_update_time_ms
  replay_equivalent_metric: replay_equivalent_gpu_hours
  replay_validation_tolerance_fraction: 0.25
  historical_gpu_hours_requires:
    - explicit_wall_clock
    - active_gpu_count
    - known_hardware_identity
    - complete_required_stages
  replay_requires:
    warmup_updates: 20
    measured_updates: 100
    measured_blocks: 10
    updates_per_block: 10
    clean_gpu: true
    checkpoint_write: forbidden
    archived_weights_mutation: forbidden
    timing_boundary: synchronized_update_core_preloaded_batch
    stability_gate: first_five_vs_last_five_block_medians

replay:
  scaffold_script: Dis_SI_Process/scripts/benchmark_training_replay_v4.py
  output_schema: figure5-training-replay-v4
  run_by_default: false
  safety_note: "Execution is an in-memory timing replay only: no checkpoint, optimizer archive, history, or dataset file may be written."

output:
  root: Dis_SI_Process/results/ValidationV4/TrainingCost
  run_id: training_cost_formal_v4
