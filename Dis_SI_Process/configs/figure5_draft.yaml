schema_version: figure5-validation-v3

figure:
  width_mm: 183
  composed_height_mm: 118
  formats: [svg]
  row_headers:
    top: Conditional ensemble quality
    bottom: Computational characteristics
  panel_map:
    a: uq_crps
    b: uq_spread_error_methods
    c: cost_native_clean
    d: cost_query_scaling_methods
    e: cost_memory_scaling_methods
  output_stems:
    a: fig5a_normalized_crps
    b: fig5b_spread_error_methods
    c: fig5c_accuracy_latency_clean
    d: fig5d_query_latency
    e: fig5e_query_memory
    composed: fig5_composed_v3

paper_contract:
  conditioning: Cond_T
  sensor_count: 256
  native_query_count: 40300
  batch_size: 1
  precision: float32
  unobserved_fields: [Y_CH4, Y_CO, U1, p]
  generative_method_order: [DMF-Gen, FFM-FNO, FFM-Perceiver, Latent FM, SiT]
  method_order: [DMF-Gen, FFM-FNO, FFM-Perceiver, Latent FM, SiT, MLP-RBF, Geo-FNO, Senseiver]

formal_inputs:
  uq_root: Dis_SI_Process/results/ValidationV3/UQCompare
  uq_run_id: uq_compare_formal_20260830_v3r6
  uq_pilot_run_ids: [pilot_uq_compare_20260830_v3, pilot_uq_compare_deterministic_20260830_v3, pilot_uq_compare_common_norm_20260830_v3, pilot_uq_compare_prepared_20260830_v3r2, pilot_uq_compare_prepared_20260830_v3r3, pilot_uq_compare_prepared_20260830_v3r4]
  cost_root: Dis_SI_Process/results/ValidationV3/CostClean
  cost_run_id: formal_cost_clean_v3_20260830_v3
  field_l2_summary: 0_demo_TurbulentCombustion/Save_TrainedModel/_TrainedModels/_Process_Results/FieldL2/FieldL2_summary_paper_full_20260711.csv

v2_provenance:
  completion_report: Dis_SI_Process/docs/initial_draft_summary.md
  superseded_cost_run: 0_demo_TurbulentCombustion/Save_TrainedModel/_TrainedModels/_Process_Results/ValidationV2/Cost/formal_cost_20260830_v2
  superseded_dmf_latency_ms: 127.04870223999023
  reused_dmf_u2: 0_demo_TurbulentCombustion/Save_TrainedModel/_TrainedModels/_Process_Results/ValidationV2/Uncertainty/u2_formal_20260830_v1

formal_protocol:
  uq:
    states: 200
    draws_per_state: 64
    sensor_count: 256
    fields: [Y_CH4, Y_CO, U1, p]
    field_weights: [0.25, 0.25, 0.25, 0.25]
    crps: empirical_pointwise_normalized_by_training_std
    spread: macro_normalized_spatial_rms_ensemble_std
    error: macro_ensemble_mean_physical_relative_l2
    association: spearman
    interval: temporal_moving_block_bootstrap_95ci
  cost:
    timing_boundary: warm_model_core_geometry_persisted
    warmups: 20
    minimum_repeats: 30
    minimum_timed_seconds: 10
    query_counts: [1024, 4096, 16384, 40300]
    throughput_extension: not_run
    latency_interval: iqr
    memory: peak_allocated_gpu
    checkpoint_join: exact_identity

build_policy:
  manuscript_mode: strict-formal
  strict_formal:
    require_all_panels: true
    require_v3_schema: true
    require_exact_identity: true
    require_passing_qa: true
    reject_validation_v2_cost: true
    reject_missing_cross_model_uq: true
    reject_proxy: true
    on_incomplete: fail
  main_figure:
    allow_calibration_curves: false
    allow_interval_width_curves: false
    allow_nfe_panel: false
    allow_full_grid_slice_scaling: false
    allow_throughput_extension: false

style:
  font_family: [Arial, DejaVu Sans, Liberation Sans]
  method_colors:
    DMF-Gen: "#E63946"
    FFM-FNO: "#1D3557"
    FFM-Perceiver: "#457B9D"
    Latent FM: "#6A4C93"
    SiT: "#A28BC4"
    MLP-RBF: "#2A9D8F"
    Geo-FNO: "#F4A261"
    Senseiver: "#8D99AE"
  pending_face: "#F1F3F5"
  pending_edge: "#ADB5BD"
